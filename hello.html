<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransLingua AI Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: orange;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }
        
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        select,
        button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>TransLingua AI Translator</h2>
        <textarea id="inputText" placeholder="Enter text..."></textarea>
        <br>
        <select id="sourceLang"></select>
        <select id="targetLang"></select>
        <br>
        <button onclick="translateText()">Translate</button>
        <h3>Translation:</h3>
        <p id="outputText"></p>
    </div>

    <script>
        async function fetchLanguages() {
            const languages = {
                "af": "Afrikaans",
                "sq": "Albanian",
                "am": "Amharic",
                "ar": "Arabic",
                "hy": "Armenian",
                "az": "Azerbaijani",
                "eu": "Basque",
                "be": "Belarusian",
                "bn": "Bengali",
                "bs": "Bosnian",
                "bg": "Bulgarian",
                "ca": "Catalan",
                "ceb": "Cebuano",
                "zh": "Chinese",
                "co": "Corsican",
                "hr": "Croatian",
                "cs": "Czech",
                "da": "Danish",
                "nl": "Dutch",
                "en": "English",
                "eo": "Esperanto",
                "et": "Estonian",
                "tl": "Filipino",
                "fi": "Finnish",
                "fr": "French",
                "fy": "Frisian",
                "gl": "Galician",
                "ka": "Georgian",
                "de": "German",
                "el": "Greek",
                "gu": "Gujarati",
                "ht": "Haitian Creole",
                "ha": "Hausa",
                "haw": "Hawaiian",
                "he": "Hebrew",
                "hi": "Hindi",
                "hmn": "Hmong",
                "hu": "Hungarian",
                "is": "Icelandic",
                "id": "Indonesian",
                "ga": "Irish",
                "it": "Italian",
                "ja": "Japanese",
                "jv": "Javanese",
                "kn": "Kannada",
                "kk": "Kazakh",
                "km": "Khmer",
                "rw": "Kinyarwanda",
                "ko": "Korean",
                "ku": "Kurdish",
                "ky": "Kyrgyz",
                "lo": "Lao",
                "la": "Latin",
                "lv": "Latvian",
                "lt": "Lithuanian",
                "lb": "Luxembourgish",
                "mk": "Macedonian",
                "mg": "Malagasy",
                "ms": "Malay",
                "ml": "Malayalam",
                "mt": "Maltese",
                "mi": "Maori",
                "mr": "Marathi",
                "mn": "Mongolian",
                "my": "Myanmar (Burmese)",
                "ne": "Nepali",
                "no": "Norwegian",
                "ny": "Nyanja",
                "or": "Odia (Oriya)",
                "ps": "Pashto",
                "fa": "Persian",
                "pl": "Polish",
                "pt": "Portuguese",
                "pa": "Punjabi",
                "ro": "Romanian",
                "ru": "Russian",
                "sm": "Samoan",
                "gd": "Scots Gaelic",
                "sr": "Serbian",
                "st": "Sesotho",
                "sn": "Shona",
                "sd": "Sindhi",
                "si": "Sinhala",
                "sk": "Slovak",
                "sl": "Slovenian",
                "so": "Somali",
                "es": "Spanish",
                "su": "Sundanese",
                "sw": "Swahili",
                "sv": "Swedish",
                "tg": "Tajik",
                "ta": "Tamil",
                "tt": "Tatar",
                "te": "Telugu",
                "th": "Thai",
                "tr": "Turkish",
                "tk": "Turkmen",
                "uk": "Ukrainian",
                "ur": "Urdu",
                "ug": "Uyghur",
                "uz": "Uzbek",
                "vi": "Vietnamese",
                "cy": "Welsh",
                "xh": "Xhosa",
                "yi": "Yiddish",
                "yo": "Yoruba",
                "zu": "Zulu"
            };

            const sourceSelect = document.getElementById("sourceLang");
            const targetSelect = document.getElementById("targetLang");

            for (const [code, name] of Object.entries(languages)) {
                let option1 = new Option(name, code);
                let option2 = new Option(name, code);
                sourceSelect.appendChild(option1);
                targetSelect.appendChild(option2);
            }
        }

        async function translateText() {
            const text = document.getElementById("inputText").value;
            const sourceLang = document.getElementById("sourceLang").value;
            const targetLang = document.getElementById("targetLang").value;

            if (!text) {
                alert("Please enter text to translate");
                return;
            }

            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`);
            const data = await response.json();
            document.getElementById("outputText").innerText = data.responseData.translatedText;
        }

        document.addEventListener("DOMContentLoaded", fetchLanguages);
    </script>
</body>

</html>
